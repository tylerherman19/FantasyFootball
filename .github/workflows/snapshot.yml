name: Football data refresh and weekly snapshot

permissions:
  contents: write

concurrency:
  group: weekly-football-data
  cancel-in-progress: false

# Tuesday noon ET — after Monday Night Football closes the previous week and
# well before Thursday's kickoff opens the next one.
#
# Exactly one capture per week, on purpose. Projections upsert on their unique
# key, so a second run would overwrite the pre-kickoff capture with post-kickoff
# data and quietly contaminate the accuracy record.
on:
  schedule:
    # Daily source/model rebuild keeps injuries inside their 24-hour cadence.
    - cron: '0 10 * * *'
    # Tuesday's fixed pre-kickoff capture remains the accuracy record.
    - cron: '0 16 * * 2'
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to snapshot (blank = current)'
        required: false

# The commit-back step this workflow used to end with has been removed.
#
# It wrote refreshed artifacts to `model/artifacts` and pushed them to `main`,
# and it had never once succeeded — `git log --grep='Weekly projections refresh'`
# returned nothing across every branch, while the artifacts in the repository
# carried timestamps from local runs. Nothing recorded the failure, so the
# application served hand-committed artifacts while appearing to be automated.
#
# Two things were wrong with the design, independent of the failure. Committing
# data to git makes refresh a deploy, so it can never be on demand — the product
# needs a "refresh now" button and a push cannot be one. And a job that force-
# advances `main` from CI is a poor fit for a repository whose history is meant
# to be readable.
#
# What replaced it: `/api/refresh` for the serve-time sources, on a Vercel cron
# (see `vercel.json`) and pressable by hand, with every attempt recorded in
# `data_sources` / `refresh_runs` so a failure is visible rather than silent.
#
# What this workflow still does, and should: capture projections and odds before
# kickoff. That capture is the accuracy record, it only works if it happens at a
# fixed time each week, and it is the one thing here that genuinely belongs on a
# schedule rather than behind a button.

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:ci -- ${{ github.event.inputs.week }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # Score the week that just finished, against the projections captured
      # before it started.
      #
      # Tuesday noon is the right moment for both halves: Monday Night Football
      # has closed the previous week, so its actuals are final, and Thursday has
      # not opened the next one, so this week's capture is still pre-kickoff.
      #
      # This is the step that turns a table of recorded projections into a
      # measurement. Without it the product could say it was tested and could
      # not say what the test found.
      - name: Score last week and report the head-to-head
        run: npm run score:snapshots:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  # Rebuild every serve-time football artifact from source, including offensive
  # and defensive scheme. Artifacts are committed because Vercel serves them
  # from the immutable deployment filesystem; this commit is therefore both the
  # versioned model record and the deployment trigger. No generated number is
  # synthesized in the web app.
  rebuild-projections:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync nflverse data
        run: uv run --project model python model/ingest/nflverse.py data/lake
        env:
          PYTHONPATH: .
      - name: Build player crosswalk
        run: uv run --project model python model/ingest/crosswalk.py
        env:
          PYTHONPATH: .
      - name: Export bye weeks
        run: uv run --project model python model/export_byes.py
        env:
          PYTHONPATH: .
      - name: Export availability
        run: uv run --project model python model/export_availability.py
        env:
          PYTHONPATH: .
      - name: Export game loading
        run: uv run --project model python model/export_game_loading.py
        env:
          PYTHONPATH: .
      - name: Export projections
        run: uv run --project model python model/export_projections.py
        env:
          PYTHONPATH: .
      - name: Export offense
        run: uv run --project model python model/export_offense.py
        env:
          PYTHONPATH: .
      - name: Export defense
        run: uv run --project model python model/export_defense.py
        env:
          PYTHONPATH: .
      - name: Export pressure
        run: uv run --project model python model/export_pressure.py
        env:
          PYTHONPATH: .
      - name: Export coverage
        run: uv run --project model python model/export_coverage.py
        env:
          PYTHONPATH: .
      - name: Export player history
        run: uv run --project model python model/export_player_history.py
        env:
          PYTHONPATH: .
      - name: Publish rebuilt artifacts for audit/download
        uses: actions/upload-artifact@v4
        with:
          name: football-model-artifacts
          path: model/artifacts
          retention-days: 14

      # Publication runs BEFORE the canonical sync, and the order is the whole
      # point.
      #
      # It used to run after. On 29 and 30 August the model rebuilt correctly
      # both days, the sync then died on a duplicate-key error, and because this
      # step was downstream of it the fresh projections were never committed and
      # never deployed. Production served 26 August artifacts while every
      # modelling step in the run reported success.
      #
      # Nothing about writing the history requires the history to be written
      # first. Deployment depends on the artifacts, which exist by now; the sync
      # depends on the artifacts too, and on nothing this step does. Ordering
      # them the other way made a bookkeeping table a single point of failure for
      # the product's freshness, which it has no business being.
      - name: Version artifacts and trigger production deployment
        run: |
          git config user.name "fantasy-edge-data-bot"
          git config user.email "fantasy-edge-data-bot@users.noreply.github.com"
          git add model/artifacts
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "Refresh football model artifacts"
            git push origin HEAD:main
          fi

      # Stamp and store the artifacts only after they have been rebuilt. Running
      # this in the snapshot job raced the rebuild and recorded yesterday's
      # timestamps, leaving production marked stale after a successful refresh.
      #
      # Still fails the job when it fails — a silent bookkeeping failure is what
      # let the original one run for two days unnoticed — but it can no longer
      # take the fresh numbers down with it.
      - name: Sync rebuilt artifacts and freshness ledger
        run: npx tsx scripts/sync-canonical.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
