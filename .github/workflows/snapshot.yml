name: Weekly snapshot

permissions:
  contents: write

concurrency:
  group: weekly-football-data
  cancel-in-progress: false

# Tuesday noon ET — after Monday Night Football closes the previous week and
# well before Thursday's kickoff opens the next one.
#
# Exactly one capture per week, on purpose. Projections upsert on their unique
# key, so a second run would overwrite the pre-kickoff capture with post-kickoff
# data and quietly contaminate the accuracy record.
on:
  schedule:
    - cron: '0 16 * * 2'
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to snapshot (blank = current)'
        required: false

# The commit-back step this workflow used to end with has been removed.
#
# It wrote refreshed artifacts to `model/artifacts` and pushed them to `main`,
# and it had never once succeeded — `git log --grep='Weekly projections refresh'`
# returned nothing across every branch, while the artifacts in the repository
# carried timestamps from local runs. Nothing recorded the failure, so the
# application served hand-committed artifacts while appearing to be automated.
#
# Two things were wrong with the design, independent of the failure. Committing
# data to git makes refresh a deploy, so it can never be on demand — the product
# needs a "refresh now" button and a push cannot be one. And a job that force-
# advances `main` from CI is a poor fit for a repository whose history is meant
# to be readable.
#
# What replaced it: `/api/refresh` for the serve-time sources, on a Vercel cron
# (see `vercel.json`) and pressable by hand, with every attempt recorded in
# `data_sources` / `refresh_runs` so a failure is visible rather than silent.
#
# What this workflow still does, and should: capture projections and odds before
# kickoff. That capture is the accuracy record, it only works if it happens at a
# fixed time each week, and it is the one thing here that genuinely belongs on a
# schedule rather than behind a button.

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:ci -- ${{ github.event.inputs.week }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      # Push the week's artifacts into the canonical store.
      #
      # This is what turns the artifact from the only copy into the current one.
      # It has to run on the same schedule as the snapshot, because the thing it
      # preserves — what the model believed this week — stops existing the moment
      # the exporter next overwrites the file.
      #
      # Idempotent on (player, season, week, model_version), so a re-run corrects
      # rather than duplicates.
      - name: Sync the canonical store
        run: npx tsx scripts/sync-canonical.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  # Rebuild every serve-time football artifact from source, including offensive
  # and defensive scheme. Artifacts are committed because Vercel serves them
  # from the immutable deployment filesystem; this commit is therefore both the
  # versioned model record and the deployment trigger. No generated number is
  # synthesized in the web app.
  rebuild-projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync nflverse and rebuild integrated model artifacts
        run: |
          uv run --project model python model/ingest/nflverse.py data/lake
          uv run --project model python model/ingest/crosswalk.py
          uv run --project model python model/export_byes.py
          uv run --project model python model/export_availability.py
          uv run --project model python model/export_game_loading.py
          uv run --project model python model/export_projections.py
          uv run --project model python model/export_offense.py
          uv run --project model python model/export_defense.py
          uv run --project model python model/export_pressure.py
          uv run --project model python model/export_coverage.py
          uv run --project model python model/export_player_history.py
        env:
          PYTHONPATH: .
      - name: Publish rebuilt artifacts for audit/download
        uses: actions/upload-artifact@v4
        with:
          name: football-model-artifacts
          path: model/artifacts
          retention-days: 14
      - name: Version artifacts and trigger production deployment
        run: |
          git config user.name "fantasy-edge-data-bot"
          git config user.email "fantasy-edge-data-bot@users.noreply.github.com"
          git add model/artifacts
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "Refresh football model artifacts"
            git push origin HEAD:main
          fi
