[project]
name = "ffe-model"
version = "0.0.0"
description = "Offline modeling: feature store, training, backtesting. Exports artifacts the TS engine serves."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.3",
    "polars>=1.17.1",
    "pyarrow>=18.1.0",
    "httpx>=0.28.1",
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.4"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
